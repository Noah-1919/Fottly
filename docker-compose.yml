services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the bucket used by the app on startup, so you don't have to
  # do it by hand from the MinIO console in every new environment.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/fottly &&
      exit 0
      "

  # Internal background-removal service. Not exposed to the host: only
  # the "app" service talks to it over the docker-compose internal network.
  rembg:
    image: danielgatis/rembg:latest
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    volumes:
      - rembg-models:/root/.u2net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: fottly
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      API_KEY: dev-secret-key
      REMBG_URL: http://rembg:7000
      MAX_UPLOAD_SIZE_MB: "25"
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW_MS: "60000"
    depends_on:
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      rembg:
        condition: service_healthy

volumes:
  minio-data:
  rembg-models:
